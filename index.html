<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikmat'OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="boot-screen">
    <pre id="boot-log"></pre>
    <div id="boot-bar-wrap">
      <div id="boot-bar"></div>
    </div>
  </div>

  <div id="welcome-screen" class="hidden">
    <div class="welcome-content">
      <div class="logo">HIKMAT<span class="logo-dim">'OS</span></div>
      <div class="tagline">a browser-based operating system</div>
      <div class="spinner"></div>
      <button id="enter-btn">Press Enter to Continue</button>
    </div>
    <div class="version-tag">v0.1.0 — built for Hack Club Stardance</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
